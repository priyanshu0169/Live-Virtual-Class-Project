    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f1fde1;
            color: #333;
        }

        h1 {
            text-align: center;
            font-size: 2rem;
            margin-bottom: 20px;
        }

        .contact-Main {
            background-color: grey;
            padding-top: 1%;
            padding-bottom: 1%;
            text-align: center;
            color: #333;
            text-shadow: 2px 2px grey;
            margin-top: 4.5%;
            margin-bottom: 5%;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: flex-start;
            gap: 20px;
            margin: 0 auto;
            padding: 17px;
        }

        .inner-container,
        .inner-form {
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            flex: 1;
            min-width: 300px;
            max-width: 700px;

        }

        .inner-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            height: 430px;
            margin-bottom: 15%;
        }

        .inner-container p {
            margin-bottom: 15px;
            font-size: 1rem;
            line-height: 1.5;
        }

        iframe {
            border-radius: 10px;
            border: 0;
            max-width: 100%;
            margin: 5%;
        }

        .form2 {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .cnt {
            width: 95%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1rem;
        }

        .txt {
            width: 95%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1rem;
            resize: none;
        }

        .rg-btn {
            display: flex;
            flex-direction: row;
            gap: 2px;
        }

        .rg-btn .btn {
            width: 100%;
            padding: 10px;
            background-color: #6c9f33;
            color: #fff;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .rg-btn .btn:hover {
            background-color: #588026;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
