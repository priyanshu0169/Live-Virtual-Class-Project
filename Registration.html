<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>
  <script src="./pages/loadComponents.js" defer></script>
  
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">



  <style>
    .form {
      box-sizing: border-box;
    }

    input[type=text],
    select,
    textarea {
      width: 50%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 4px;
      resize: vertical;
    }

    label {
      padding: 12px 12px 12px 0;
      display: inline-block;
    }

    input[type=submit] {
      background-color: #04AA6D;
      color: white;
      padding: 12px 20px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      float: right;
    }

    input[type=submit]:hover {
      background-color: #45a049;
      border-radius: 20px;
    }

    .con1 {
      background-color: #f2f2f2;
      padding: 20px;
      border-radius: 10px;
      width: 50%;
    }

    .col-25 {
      float: left;
      width: 25%;
      margin-top: 6px;
      border-radius: 20px;
    }

    .col-75 {
      float: left;
      width: 50%;
      margin-top: 6px;
      border-radius: 20px;
    }


    .row::after {
      content: "";
      display: table;
      clear: both;
    }

    @media screen and (max-width: 600px) {

      .col-25,
      .col-75,
      input[type=submit] {
        width: 50%;
        margin-top: 0;
      }
    }

    h1 {
      text-align: center;
      color: black;
      padding: 10px;
      /* background-color: grey; */
      margin-top: 20%;
      padding-top: 90px;
    }
  </style>

  <script>
    function validateForm() {
      alert("testing");
      let x = document.forms["myForm"]["fname"].value;
      if (x == "") {
        alert("Name must be filled out");
        window.setTimeout(function () {
          document.getElementById("fname").focus();
        }, 0);
        return false;
      }

      let y = document.forms["myForm"]["lname"].value;
      if (y == "") {
        alert("Last name must be filled out");
        window.setTimeout(function () {
          document.getElementById("lname").focus();
        }, 0);
        return false;
      }
      let z = document.forms["myForm"]["subject"].value;
      if (z == "" || z.length < 6) {
        alert("Remarks should not be less than 6 letters");
        window.setTimeout(function () {
          document.getElementById("subject").focus();
        }, 0);
        return false;
      }
    }
    function jfun5() {
      putheaderandfooter();

    }
  </script>
</head>

<body onload="jfun5()">
  <div id="nav-placeholder"></div>
  <article class="form mb-4 py-8">
    <h1>Registration Form <i class="fa-solid fa-address-card"></i></h1>
    <div class="container con1">
      <form name="myForm" form action="thanks.html">
        <div class="row">
          <div class="col-25">
            <label for="fname">First Name
            </label>
          </div>
          <div class="col-75">
            <input type="text" id="fname" name="firstname" placeholder="Your name.." onblur="return validateForm()">
          </div>
        </div>
        <div class="row">
          <div class="col-25">
            <label for="lname">Last Name</label>
          </div>
          <div class="col-75">
            <input type="text" id="lname" name="lastname" placeholder="Your last name..">
          </div>
        </div>
        <div class="row">
          <div class="col-25">
            <label for="course">Course</label>
          </div>
          <div class="col-75">
            <select id="course" name="course">
              <option value="Java">Java</option>
              <option value="Web Development">Web Development</option>
              <option value="Data Analysis">Data Analysis</option>
            </select>
          </div>
        </div>
        <div class="row">
          <div class="col-25">
            <label for="subject">Remarks</label>
          </div>
          <div class="col-75">
            <textarea id="subject" name="subject" placeholder="Write something.." style="height:200px"></textarea>
          </div>
        </div>
        <br>
        <div class="row">
          <input type="submit" value="Submit">
        </div>
      </form>
    </div>
  </article>
  <div id="footer-placeholder"></div>

</body>

</html>
